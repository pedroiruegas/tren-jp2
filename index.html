<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>TrenJP2 — ¿Está pasando el tren?</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-elev: #15151d;
            --bg-elev-2: #1f1f2b;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-dim: #8888a0;
            --accent: #ffb627;        /* amarillo señal de tren */
            --accent-warm: #ff6b35;   /* naranja alerta */
            --success: #4ade80;
            --danger: #ef4444;
            --display: 'Bricolage Grotesque', system-ui, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            min-height: 100vh;
            overscroll-behavior: none;
        }
        
        /* Fondo con sutil ruido y gradiente */
        body {
            background: 
                radial-gradient(ellipse at top, #1a1a28 0%, var(--bg) 60%),
                var(--bg);
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 39px,
                    rgba(255, 182, 39, 0.02) 39px,
                    rgba(255, 182, 39, 0.02) 40px
                );
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px 100px;
            position: relative;
            z-index: 1;
        }
        
        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-top: env(safe-area-inset-top, 0);
        }
        
        .logo {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        
        .ubicacion {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        /* CARD PRINCIPAL */
        .estado-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .estado-card.con-tren {
            background: linear-gradient(135deg, #2a1810 0%, #1f1208 100%);
            border-color: var(--accent-warm);
            box-shadow: 0 0 40px rgba(255, 107, 53, 0.15);
        }
        
        .estado-card.sin-tren {
            border-color: rgba(74, 222, 128, 0.3);
        }
        
        .estado-emoji {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 16px;
            display: block;
        }
        
        .estado-titulo {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }
        
        .con-tren .estado-titulo {
            color: var(--accent);
        }
        
        .sin-tren .estado-titulo {
            color: var(--success);
        }
        
        .estado-descripcion {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.5;
        }
        
        .meta-info {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .meta-info span strong {
            color: var(--text);
            font-weight: 600;
        }
        
        /* BOTÓN PRINCIPAL DE REPORTE */
        .reportar-btn {
            width: 100%;
            padding: 24px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-warm) 100%);
            color: #0a0a0f;
            font-family: var(--display);
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 24px rgba(255, 182, 39, 0.25);
            margin-bottom: 12px;
        }
        
        .reportar-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255, 182, 39, 0.35); }
        .reportar-btn:active { transform: translateY(0) scale(0.98); }
        .reportar-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .reportar-btn .icon { font-size: 24px; }
        
        .hint {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 32px;
        }
        
        /* SECCIÓN DE HISTORIAL/ESTADÍSTICAS */
        .seccion {
            margin-bottom: 24px;
        }
        
        .seccion-titulo {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            margin-bottom: 14px;
            font-family: var(--mono);
        }
        
        .historial {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 4px;
        }
        
        .reporte-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .reporte-item + .reporte-item {
            border-top: 1px solid var(--border);
            border-radius: 0;
        }
        
        .reporte-tiempo {
            font-family: var(--mono);
            color: var(--accent);
            font-weight: 600;
        }
        
        .reporte-usuario {
            color: var(--text-dim);
            font-size: 13px;
        }
        
        .vacio {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-dim);
            font-size: 14px;
        }
        
        /* TOAST */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-elev-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        
        /* FOOTER */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-dot"></span>
                TrenJP2
            </div>
            <div class="ubicacion">SN · Av. JP II</div>
        </header>
        
        <div id="estadoCard" class="estado-card sin-tren">
            <span class="estado-emoji" id="estadoEmoji">⏳</span>
            <h1 class="estado-titulo" id="estadoTitulo">Consultando...</h1>
            <p class="estado-descripcion" id="estadoDesc">Buscando reportes recientes</p>
            <div class="meta-info">
                <span>Reportes 15min · <strong id="totalReportes">—</strong></span>
                <span>Actualizado · <strong id="actualizado">—</strong></span>
            </div>
        </div>
        
        <button id="reportarBtn" class="reportar-btn">
            <span class="icon">🚂</span>
            <span>Reportar tren ahora</span>
        </button>
        <p class="hint">Comparte tu ubicación al reportar</p>
        
        <section class="seccion">
            <h2 class="seccion-titulo">Últimas 24 horas</h2>
            <div class="historial" id="historial">
                <div class="vacio">Cargando...</div>
            </div>
        </section>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        // Detecta automáticamente si estamos en local o producción
        const API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:8000'
            : 'https://tren-jp2-api.onrender.com';
        // ⚠️ Cuando despliegues en Render, cambia la URL de producción de arriba
        
        // ============================================================
        // UTILIDADES
        // ============================================================
        function showToast(msg, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast show ${tipo}`;
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
        
        function tiempoRelativo(timestamp) {
            const ahora = new Date();
            const fecha = new Date(timestamp);
            const min = Math.floor((ahora - fecha) / 60000);
            if (min < 1) return 'ahora';
            if (min < 60) return `hace ${min} min`;
            const horas = Math.floor(min / 60);
            if (horas < 24) return `hace ${horas}h`;
            return fecha.toLocaleDateString('es-MX');
        }
        
        // ============================================================
        // CONSULTAR ESTADO
        // ============================================================
        async function actualizarEstado() {
            try {
                const res = await fetch(`${API_URL}/estado`);
                const data = await res.json();
                
                const card = document.getElementById('estadoCard');
                const emoji = document.getElementById('estadoEmoji');
                const titulo = document.getElementById('estadoTitulo');
                const desc = document.getElementById('estadoDesc');
                
                if (data.hay_tren) {
                    card.className = 'estado-card con-tren';
                    emoji.textContent = '🚂';
                    titulo.textContent = '¡Tren pasando!';
                    desc.textContent = data.mensaje;
                } else {
                    card.className = 'estado-card sin-tren';
                    emoji.textContent = '✅';
                    titulo.textContent = 'Vía libre';
                    desc.textContent = 'Sin reportes recientes. Puedes intentar la ruta directa.';
                }
                
                document.getElementById('totalReportes').textContent = data.total_reportes_recientes;
                document.getElementById('actualizado').textContent = new Date().toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit'});
                
            } catch (e) {
                showToast('No pude conectar con el servidor', 'error');
                console.error(e);
            }
        }
        
        // ============================================================
        // CARGAR HISTORIAL
        // ============================================================
        async function cargarHistorial() {
            try {
                const res = await fetch(`${API_URL}/historico?horas=24&limite=10`);
                const data = await res.json();
                
                const cont = document.getElementById('historial');
                if (data.reportes.length === 0) {
                    cont.innerHTML = '<div class="vacio">Sin reportes en las últimas 24h</div>';
                    return;
                }
                
                cont.innerHTML = data.reportes.map(r => `
                    <div class="reporte-item">
                        <span class="reporte-tiempo">${tiempoRelativo(r.timestamp)}</span>
                        <span class="reporte-usuario">${r.usuario || 'anónimo'}</span>
                    </div>
                `).join('');
                
            } catch (e) {
                console.error(e);
            }
        }
        
        // ============================================================
        // REPORTAR TREN
        // ============================================================
        document.getElementById('reportarBtn').addEventListener('click', async () => {
            const btn = document.getElementById('reportarBtn');
            btn.disabled = true;
            btn.querySelector('span:last-child').textContent = 'Obteniendo ubicación...';
            
            if (!navigator.geolocation) {
                showToast('Tu navegador no soporta geolocalización', 'error');
                btn.disabled = false;
                btn.querySelector('span:last-child').textContent = 'Reportar tren ahora';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const usuario = localStorage.getItem('tren_usuario') || 
                                    prompt('¿Cómo te llamas? (solo la primera vez)') || 'anónimo';
                    localStorage.setItem('tren_usuario', usuario);
                    
                    const res = await fetch(`${API_URL}/reportar`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            latitud: pos.coords.latitude,
                            longitud: pos.coords.longitude,
                            usuario: usuario
                        })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        showToast('¡Reporte enviado! 🚂', 'success');
                        await actualizarEstado();
                        await cargarHistorial();
                    } else {
                        showToast(data.detail || 'Error al reportar', 'error');
                    }
                } catch (e) {
                    showToast('Error de red', 'error');
                } finally {
                    btn.disabled = false;
                    btn.querySelector('span:last-child').textContent = 'Reportar tren ahora';
                }
            }, (err) => {
                showToast('No pude obtener tu ubicación. Activa GPS.', 'error');
                btn.disabled = false;
                btn.querySelector('span:last-child').textContent = 'Reportar tren ahora';
            }, {enableHighAccuracy: true, timeout: 10000});
        });
        
        // ============================================================
        // INICIO + AUTO-REFRESCO
        // ============================================================
        actualizarEstado();
        cargarHistorial();
        setInterval(actualizarEstado, 30000); // refresca cada 30s
    </script>
</body>
</html>
